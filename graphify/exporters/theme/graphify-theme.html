<!-- graphify-theme v2: frosted sidebar (base) / black rail (minimised) / component-sheet node panel (expanded). Safe to re-run (guarded by window.__gfTheme) -->
<style id="gf-theme">
:root{
  --gf-ink:#1b1e1f; --gf-mute:#5d6165; --gf-faint:#9a9ea2; --gf-line:rgba(20,22,24,.09);
  --gf-chip:rgba(20,22,24,.06); --gf-paper:#fff; --gf-stage:#e3e8e8; --gf-dark:#1f2a2a;
  --gf-canvas:#0d0e0f;
  --gf-sans:"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --gf-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --gf-ease:cubic-bezier(.16,1,.3,1);
  --gf-sbw:326px;
}
body{background:#000;font-family:var(--gf-sans);--gf-sbw:326px}
body.gf-min{--gf-sbw:64px}
::selection{background:var(--gf-dark);color:#fff}

/* canvas: rounded stage, flush against the rail when minimised */
#graph{order:2;flex:1;min-width:0;background:var(--gf-canvas);border-radius:22px;margin:10px 10px 10px 0;overflow:hidden}
body.gf-min #graph{margin:0;border-radius:22px 0 0 22px}

#sidebar.gf{order:1;flex:0 0 326px;width:326px;padding:10px;background:transparent;border:0;display:block;color:var(--gf-ink);font:14px/1.35 var(--gf-sans)}
#sidebar.gf *{box-sizing:border-box}
#sidebar.gf button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#sidebar.gf .ic{width:20px;height:20px;flex:none;display:block}
#sidebar.gf :focus-visible{outline:2px solid var(--gf-ink);outline-offset:2px}
body.gf-min #sidebar.gf{flex:0 0 64px;width:64px;padding:0}

/* ===== base: frosted panel ===== */
.gf-full{height:100%;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#eff0f2 0%,#e5e7ea 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 18px 40px -12px rgba(0,0,0,.6)}
body.gf-min .gf-full{display:none}
.gf-top{display:flex;align-items:center;gap:12px;padding:16px 14px 10px 16px}
.gf-orb{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
  background:conic-gradient(from 210deg,#ff6aa8,#7b61ff,#33b8ff,#ff6aa8);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.gf-orb .ic{width:22px;height:22px}
.gf-who{flex:1;min-width:0}
.gf-who b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-who span{display:block;font-size:13px;color:var(--gf-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#sidebar.gf .gf-iconbtn{width:36px;height:36px;border-radius:14px;display:grid;place-items:center;color:var(--gf-mute);flex:none}
#sidebar.gf .gf-iconbtn:hover{background:var(--gf-chip);color:var(--gf-ink)}

.gf-find{position:relative;margin:4px 14px 6px;height:42px;border-radius:14px;background:var(--gf-chip);box-shadow:inset 0 0 0 1px rgba(20,22,24,.05);display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--gf-mute)}
.gf-find:focus-within{background:#fff;box-shadow:0 0 0 2px var(--gf-ink)}
#sidebar.gf #search{flex:1;min-width:0;height:100%;width:auto;background:transparent;border:0;border-radius:0;padding:0;font:inherit;font-size:14.5px;color:var(--gf-ink);outline:none}
#sidebar.gf #search::placeholder{color:var(--gf-mute);opacity:1}
.gf-kbd{font:600 12.5px/1 var(--gf-mono);border:1px solid rgba(20,22,24,.18);color:var(--gf-mute);padding:3px 6px;border-radius:6px;flex:none}
#sidebar.gf #search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;max-height:44vh;overflow:auto;padding:6px;background:#fff;border-radius:14px;box-shadow:0 18px 40px -8px rgba(0,0,0,.35),0 0 0 1px var(--gf-line)}
#sidebar.gf .search-item{display:flex;align-items:center;gap:10px;padding:9px 10px!important;border-left:0!important;border-radius:10px;font-size:14px;color:var(--gf-ink);white-space:nowrap}
#sidebar.gf .search-item:hover{background:var(--gf-chip)}

.gf-scroll{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(20,22,24,.3) transparent}
.gf-scroll>*{flex:none}
#gf-view{order:1;border-top:0!important;margin-top:0!important}.gf-comm{order:2}#gf-zones{order:3}#gf-colour{order:4}#gf-hubs{order:5}#gf-conn{order:6}#gf-recent{order:7}
.gf-sec{border-top:1px solid var(--gf-line);margin-top:4px;padding-top:12px}
.gf-sec .gf-seg{margin:2px 0 8px}.gf-sec .gf-seg button{height:32px;font-size:13px}
.gf-sec{padding:6px 14px 4px}
.gf-sec+.gf-sec{border-top:1px solid var(--gf-line);margin-top:4px;padding-top:12px}
.gf-lab{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 6px;font-size:13px;color:var(--gf-mute);font-weight:500}
.gf-nav{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 10px;border-radius:14px;color:var(--gf-ink);font-size:14.5px;font-weight:500}
.gf-nav:hover{background:var(--gf-chip)}
.gf-nav .gf-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-nav.on{background:#fff;box-shadow:0 8px 20px -6px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.9)}
.gf-nav[disabled]{opacity:.45;cursor:default}
.gf-nav[disabled]:hover{background:none}
.gf-nav.off .gf-l{text-decoration:line-through;color:var(--gf-mute)}
.gf-nav.off .ic{opacity:.45}
.gf-badge{min-width:24px;padding:2px 8px;border-radius:999px;background:var(--gf-chip);color:var(--gf-mute);font-size:12.5px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;flex:none}
.gf-nav.on .gf-badge{background:var(--gf-chip)}
.gf-recent-empty{padding:4px 10px 8px;font-size:13px;color:var(--gf-mute)}
.gf-flagsvg{width:20px;height:8px;color:var(--gf-ink)}

/* communities tree */
.gf-comm{display:flex;flex-direction:column;padding:8px 14px 12px;border-top:1px solid var(--gf-line);margin-top:4px}
.gf-comm-h{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px;font-size:13px;color:var(--gf-mute);font-weight:500}
#sidebar.gf .gf-sortbtn{display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:var(--gf-chip);font-size:12.5px;font-weight:600;color:var(--gf-ink)}
#sidebar.gf .gf-sortbtn:hover{background:rgba(20,22,24,.11)}
.gf-cfind{height:38px;border-radius:14px;background:var(--gf-chip);box-shadow:inset 0 0 0 1px rgba(20,22,24,.05);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--gf-mute);margin-bottom:8px;flex:none}
.gf-cfind:focus-within{background:#fff;box-shadow:0 0 0 2px var(--gf-ink)}
.gf-cfind input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:14px;color:var(--gf-ink);outline:none;padding:0}
.gf-cfind input::placeholder{color:var(--gf-mute);opacity:1}
.gf-tree{max-height:46vh;overflow:auto;border-radius:14px;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px var(--gf-line);padding:6px;scrollbar-width:thin;scrollbar-color:rgba(20,22,24,.3) transparent}
.gf-tr{display:flex;align-items:center;border-radius:10px;position:relative}
#sidebar.gf .gf-tr-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 8px;border-radius:10px}
.gf-tr:hover{background:var(--gf-chip)}
.gf-tr.on{background:rgba(20,22,24,.12)}
.gf-tr.on .gf-name{font-weight:700}
.gf-tr.dim .gf-name{opacity:.7}
.gf-fold{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none}
.gf-fold i{width:11px;height:11px;border-radius:3px;display:block}
.gf-name{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidebar.gf .gf-eye{width:32px;height:32px;margin-right:2px;border-radius:10px;display:grid;place-items:center;opacity:.65;flex:none}
#sidebar.gf .gf-eye .ic{width:17px;height:17px}
.gf-tr:hover .gf-eye,#sidebar.gf .gf-eye:focus-visible,.gf-tr.off .gf-eye{opacity:1}
#sidebar.gf .gf-eye:hover{background:var(--gf-chip)}
#sidebar.gf .gf-eye[aria-disabled="true"]{opacity:.2;cursor:not-allowed}
.gf-tr.off .gf-name{text-decoration:line-through;color:var(--gf-mute)}
.gf-group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 8px;border-radius:10px;font-size:14px;font-weight:600}
.gf-group>summary::-webkit-details-marker{display:none}
.gf-group>summary:hover{background:var(--gf-chip)}
.gf-group>summary .gf-ch{transition:transform .2s var(--gf-ease);color:var(--gf-mute)}
.gf-group[open]>summary .gf-ch{transform:rotate(90deg)}
.gf-kids{margin-left:18px;padding-left:8px;border-left:1px solid rgba(20,22,24,.18)}
.gf-empty{padding:14px 10px;font-size:13.5px;color:var(--gf-mute)}
#sidebar.gf .gf-empty button{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--gf-ink)}

/* ===== minimised: black rail ===== */
.gf-rail{display:none;height:100%;width:100%;background:#000;flex-direction:column;align-items:center;gap:6px;padding:14px 0 14px}
body.gf-min .gf-rail{display:flex}
#sidebar.gf .gf-rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
#sidebar.gf .gf-rb:hover{background:rgba(255,255,255,.12)}
#sidebar.gf .gf-rb.on{background:rgba(255,255,255,.16)}
#sidebar.gf .gf-rail :focus-visible{outline:2px solid #fff}
.gf-rail .gf-sp{flex:1}
.gf-rail .gf-orb{width:30px;height:30px;box-shadow:none;margin-top:4px}
.gf-rail .gf-orb .ic{width:16px;height:16px}

/* ===== expanded: component-sheet node panel ===== */
.gf-card{position:fixed;z-index:30;top:20px;bottom:20px;left:calc(var(--gf-sbw) + 24px);width:372px;max-width:calc(100vw - var(--gf-sbw) - 48px);
  display:flex;flex-direction:column;background:var(--gf-stage);color:var(--gf-ink);border-radius:26px;padding:14px;gap:12px;font:14px/1.35 var(--gf-sans);
  box-shadow:0 30px 60px -16px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.5) inset}
.gf-card[hidden]{display:none}
.gf-card *{box-sizing:border-box}
.gf-card.pop{animation:gf-pop .3s var(--gf-ease)}
@keyframes gf-pop{from{opacity:0;transform:translateX(-14px) scale(.985)}to{opacity:1;transform:none}}
.gf-card button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.gf-card :focus-visible{outline:2px solid var(--gf-ink);outline-offset:2px}
.gf-card .ic{width:20px;height:20px;display:block;flex:none}
.gf-c-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gf-pill{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;height:36px;padding:0 14px 0 8px;border-radius:999px;background:#fff;font-size:13.5px;font-weight:500}
.gf-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-c-x{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.gf-c-x:hover{background:#f3f5f5}
.gf-c-hero{padding:6px 8px 0}
.gf-c-num{font-size:78px;line-height:.95;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.gf-c-cap{font-size:13px;color:var(--gf-mute);margin-top:6px}
.gf-c-name{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:14px;overflow-wrap:anywhere}
.gf-c-src{font:13px/1.35 var(--gf-mono);color:var(--gf-mute);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gf-c-acts{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.gf-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:999px;font-size:14px;font-weight:600;background:#fff;text-align:center!important}
.gf-btn:hover{background:#f6f8f8}
.gf-btn.dark{background:var(--gf-dark);color:#fff}
.gf-btn.dark:hover{background:#2b3a3a}
.gf-btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gf-ink)}
.gf-btn.line:hover{background:rgba(255,255,255,.5)}
.gf-seg{display:flex;align-items:center;padding:4px;border-radius:999px;background:#d4dadb}
.gf-seg button{flex:1;height:36px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--gf-ink);text-align:center!important}
.gf-seg button[aria-pressed="true"]{background:var(--gf-dark);color:#fff}
.gf-key{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:0 6px;font-size:13px;color:var(--gf-mute)}
.gf-key span{display:inline-flex;align-items:center;gap:6px}
.gf-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 2px 0;scrollbar-width:thin;scrollbar-color:rgba(20,22,24,.3) transparent}
.gf-pin{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px 8px 8px;border-radius:14px;background:#fff}
.gf-pin:hover{background:#f6f8f8}
.gf-pin .gf-circ{width:40px;height:40px;border-radius:50%;background:var(--gf-stage);display:grid;place-items:center;flex:none}
.gf-pin-main{flex:1;min-width:0}
.gf-pin-label{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-pin-rel{display:block;font-size:13px;color:var(--gf-mute)}
.gf-flagsvg{width:24px;height:8px;color:var(--gf-ink);flex:none}
.gf-more{flex:none;height:44px;border-radius:999px;background:#fff;font-size:14px;font-weight:600;text-align:center!important}
.gf-cempty{padding:18px 12px;font-size:13.5px;color:var(--gf-mute);text-align:center}
.gf-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* node panel: outgoing and incoming shown together */
.gf-gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 4px 6px;background:var(--gf-stage);font-size:14px;font-weight:700}
.gf-gi{width:28px;height:28px;border-radius:50%;background:var(--gf-dark);color:#fff;display:grid;place-items:center;flex:none}
.gf-gi .ic{width:16px;height:16px}
.gf-gt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.gf-gt small{font-size:13px;font-weight:500;color:var(--gf-mute)}
.gf-gn{min-width:28px;padding:2px 9px;border-radius:999px;background:#fff;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.gf-gh[data-d="in"] .gf-gi{background:#35c8ff;color:#06303f}
.gf-gh[data-d="out"] .gf-gi{background:#ffb020;color:#3d2600}
.gf-pin[data-d="in"] .gf-circ{background:rgba(53,200,255,.28);color:#054a63;box-shadow:inset 0 0 0 2px #35c8ff}
.gf-pin[data-d="out"] .gf-circ{background:rgba(255,176,32,.30);color:#6b4200;box-shadow:inset 0 0 0 2px #ffb020}
.gf-pathbar{position:fixed;z-index:35;top:20px;left:calc(var(--gf-sbw) + 24px + (100vw - var(--gf-sbw) - 48px) / 2);transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:var(--gf-dark);color:#fff;font:600 14px var(--gf-sans);box-shadow:0 14px 30px -10px rgba(0,0,0,.7);white-space:nowrap}
.gf-pathbar[hidden]{display:none}
.gf-mini{position:fixed;right:24px;bottom:24px;z-index:20;width:220px;height:150px;border-radius:14px;background:rgba(20,22,24,.82);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 14px 30px -10px rgba(0,0,0,.7);overflow:hidden}
.gf-mini canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.gf-mini .gf-fit{position:absolute;right:8px;top:8px;height:30px;padding:0 12px;border-radius:999px;background:#fff;color:#1b1e1f;border:0;font:600 13px var(--gf-sans);cursor:pointer}
.gf-mini .gf-fit:focus-visible{outline:2px solid #fff;outline-offset:2px}
#sidebar.gf #search-results{display:none!important}
#gf-results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;max-height:52vh;overflow:auto;padding:6px;background:#fff;border-radius:14px;box-shadow:0 18px 40px -8px rgba(0,0,0,.35),0 0 0 1px var(--gf-line)}
#gf-results[hidden]{display:none}
.gf-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px;position:sticky;top:-6px;background:#fff;z-index:1}
#sidebar.gf .gf-chips button{height:30px;padding:0 12px;border-radius:999px;background:var(--gf-chip);font-size:13px;font-weight:600}
#sidebar.gf .gf-chips button[aria-pressed="true"]{background:var(--gf-dark);color:#fff}
#sidebar.gf .gf-sr-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px}
#sidebar.gf .gf-sr-item:hover,#sidebar.gf .gf-sr-item.cur{background:var(--gf-chip)}
.gf-sr-main{flex:1;min-width:0;display:flex;flex-direction:column}
.gf-sr-main b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-sr-main small{font:13px var(--gf-mono);color:var(--gf-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){ .gf-mini{display:none} .gf-pathbar{left:50%;white-space:normal;width:calc(100% - 32px);text-align:center} }
.gf-hint{padding:2px 10px 0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.gf-hint-row{display:flex;align-items:center;gap:10px}
.gf-hint p{margin:2px 0 0;color:var(--gf-mute);font-size:13.5px}
.gf-dot{width:14px;height:14px;border-radius:50%;flex:none}
.gf-dot.in{background:#35c8ff}.gf-dot.out{background:#ffb020}
.gf-zrow{display:flex;align-items:center;gap:8px;padding:3px 2px}
.gf-zpos{width:70px;font-size:13px;color:var(--gf-mute);flex:none}
#sidebar.gf .gf-zname{flex:1;min-width:0;height:36px;border:0;border-radius:12px;background:var(--gf-chip);padding:0 12px;font:inherit;font-size:14px;color:var(--gf-ink)}
#sidebar.gf .gf-zname:focus{background:#fff}
#sidebar.gf .gf-ztag{display:none}
body.gf-zoned #sidebar.gf .gf-ztag{display:block;height:26px;margin-right:4px;padding:0 10px;border-radius:999px;background:var(--gf-dark);color:#fff;font-size:13px;font-weight:600;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
/* readable floor (PRODUCT.md): nothing below 13px; secondary text 13.5px */
.gf-lab,.gf-comm-h,.gf-who span,.gf-recent-empty,.gf-key,.gf-c-cap,.gf-c-src,.gf-pin-rel,.gf-empty{font-size:13.5px}
.gf-badge,#sidebar.gf .gf-sortbtn{font-size:13px}
#sidebar.gf .gf-cfind input:focus-visible,#sidebar.gf #search:focus-visible{outline:none}
.gf-pin.far{opacity:.82}
.gf-full,.gf-rail{animation:gf-in .26s var(--gf-ease)}
@keyframes gf-in{from{opacity:0}to{opacity:1}}
/* touch: 44px targets, no keyboard hint */
@media (pointer:coarse){
  #sidebar.gf .gf-eye{width:44px;height:44px}
  #sidebar.gf .gf-iconbtn{width:44px;height:44px}
  #sidebar.gf .gf-sortbtn{height:40px}
  #sidebar.gf .gf-tr-main,.gf-group>summary{height:44px}
  #sidebar.gf .gf-nav{height:44px}
  .gf-kbd{display:none}
}

/* phone: sidebar becomes the lower sheet; rail becomes a bottom bar */
@media (max-width:760px){
  body{flex-direction:column}
  #graph{order:1;margin:10px 10px 0;border-radius:22px;flex:1 1 auto;min-height:0}
  #sidebar.gf{order:2;flex:0 0 54vh;width:100%;height:54vh}
  body.gf-min #sidebar.gf{flex:0 0 64px;height:64px;width:100%}
  body.gf-min #graph{margin:0;border-radius:0 0 22px 22px}
  .gf-scroll{overflow-y:auto;scrollbar-width:thin}
  .gf-scroll>*{flex:none}
  .gf-comm{order:-1;border-top:0;margin-top:0}
  .gf-tree{overflow:visible;flex:none;max-height:none}
  .gf-rail{flex-direction:row;padding:0 8px;justify-content:space-around;align-items:center}
  .gf-rail .gf-sp{display:none}
  #sidebar.gf .gf-rb{width:44px;height:44px}
  .gf-card{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-width:none;height:72vh}
}
@media (prefers-reduced-motion:reduce){ .gf-card.pop,.gf-full,.gf-rail{animation:none} .gf-group>summary .gf-ch{transition:none} }
</style>
<script id="gf-theme-js">
(function(){

    if (e.key === 'ArrowDown') { sIdx = Math.min(sIdx + 1, sList.length - 1); runSearch(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sIdx = Math.max(sIdx - 1, 0); runSearch(); e.preventDefault(); }

    else if (e.key === 'Escape') gres.hidden = true;
  });
  gres.addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (k) { sFilter = k.dataset.k; sIdx = 0; runSearch(); search.focus(); return; } const b = e.target.closest('[data-nid]'); if (b) pick(b.dataset.nid); });
  document.addEventListener('click', e => { if (!gres.contains(e.target) && e.target !== search) gres.hidden = true; });

  /* ---------- minimap ---------- */
  const mini = document.createElement('div'); mini.className = 'gf-mini';
  mini.innerHTML = '<canvas width="440" height="300" aria-label="Minimap of the whole graph"></canvas><button type="button" class="gf-fit">Fit all</button>'; document.body.appendChild(mini);
  const mc = $('canvas', mini), mx = mc.getContext('2d'); let mraf = 0, mb = null;
  function drawMini() {
    mraf = 0; const W = mc.width, H = mc.height; mx.clearRect(0, 0, W, H);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; const vs = [];
    RAW_NODES.forEach(n => { const q = posCache[n.id]; if (!q || !vis(n.id)) return; vs.push([n, q]); if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x; if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y; });

    const ox = (W - (x1 - x0) * k) / 2 - x0 * k, oy = (H - (y1 - y0) * k) / 2 - y0 * k; mb = {k, ox, oy};
    vs.forEach(([n, q]) => { const bc = baseColor.get(n.id) || n.color; mx.fillStyle = (bc && bc.background) || '#888'; mx.fillRect(q.x * k + ox - 1.5, q.y * k + oy - 1.5, 3, 3); });
    const s = network.getScale(), c = network.getViewPosition(), vw = graphEl.clientWidth / s, vh = graphEl.clientHeight / s;
    mx.strokeStyle = '#ffffff'; mx.lineWidth = 3; mx.strokeRect((c.x - vw / 2) * k + ox, (c.y - vh / 2) * k + oy, vw * k, vh * k);
  }
  const queueMini = () => { if (!mraf) mraf = requestAnimationFrame(drawMini); };
  network.on('afterDrawing', queueMini);
  function miniPan(ev) { if (!mb) return; const r = mc.getBoundingClientRect(); network.moveTo({position: {x: ((ev.clientX - r.left) * (mc.width / r.width) - mb.ox) / mb.k, y: ((ev.clientY - r.top) * (mc.height / r.height) - mb.oy) / mb.k}, animation: false}); }
  let mdrag = false;
  mc.addEventListener('pointerdown', e => { mdrag = true; mc.setPointerCapture(e.pointerId); miniPan(e); });
  mc.addEventListener('pointermove', e => { if (mdrag) miniPan(e); });
  mc.addEventListener('pointerup', () => { mdrag = false; });
  $('.gf-fit', mini).addEventListener('click', () => { try { network.fit({animation: {duration: 450, easingFunction: 'easeOutQuart'}}); } catch (e) {} });
  queueMini();

  /* ---------- zones: arrange the graph into labelled areas (back end / front end / run / data) ---------- */
  const ZONES = [
    {id: 'be', name: 'Back end', pos: 'top left', r: [0.00, 0.00, 0.45, 0.36]},
    {id: 'fe', name: 'Front end', pos: 'top right', r: [0.55, 0.00, 1.00, 0.36]},
    {id: 'run', name: 'Run', pos: 'middle', r: [0.30, 0.43, 0.70, 0.58]},
    {id: 'data', name: 'Data', pos: 'bottom', r: [0.08, 0.66, 0.92, 1.00]}
  ];
  const ZBYID = new Map(ZONES.map(z => [z.id, z]));
  const zoneOverride = new Map();
  let zoned = false, origPos = null, zrects = null, zassign = new Map(), zt2 = 0;
  const segsOf = n => String(n.source_file || '').toLowerCase().split(/[\\/]/).filter(Boolean);
  function zoneOfNode(n) {
    const s = segsOf(n); if (!s.length) return null;
    const base = s[s.length - 1], dirs = s.slice(0, -1);
    if (/^(main|run|cli|app|index|server|serve|manage|__main__|entry)(\.|$)/.test(base)) return 'run';
    if (dirs.some(d => /^(front.*|ui|web|client|views?|pages?|components?|templates?|public|static)$/.test(d)) || /(notif|sms|view|page|template)/.test(base)) return 'fe';
    if (dirs.some(d => /^(models?|schemas?|db|database|data|store|storage|entit(y|ies)|migrations?|repos?|repositor(y|ies))$/.test(d)) || /^(models?|schema|db|store)\./.test(base)) return 'data';
    return 'be';
  }
  function ensureAdj() {
    if (!adj) { adj = new Map(); RAW_EDGES.forEach((e, i) => { if (e.from === e.to) return; (adj.get(e.from) || adj.set(e.from, []).get(e.from)).push([e.to, i]); (adj.get(e.to) || adj.set(e.to, []).get(e.to)).push([e.from, i]); }); }
    return adj;
  }
  function assignZones() {
    zassign = new Map(); RAW_NODES.forEach(n => { const z = zoneOverride.get(n.community) || zoneOfNode(n); if (z) zassign.set(n.id, z); });
    const A = ensureAdj();
    for (let pass = 0; pass < 4; pass++) RAW_NODES.forEach(n => {
      if (zassign.has(n.id)) return;
      const c = {}; (A.get(n.id) || []).forEach(([o]) => { const z = zassign.get(o); if (z) c[z] = (c[z] || 0) + 1; });
      const best = Object.keys(c).sort((a, b) => c[b] - c[a])[0]; if (best) zassign.set(n.id, best); else if (pass === 3) zassign.set(n.id, 'be');
    });
  }
  function relaxInto(r, ids, out) {
    const n = ids.length; if (!n) return;
    const idx = new Map(ids.map((id, i) => [id, i])), px = new Float64Array(n), py = new Float64Array(n);
    let a0 = 1e9, b0 = 1e9, a1 = -1e9, b1 = -1e9;
    ids.forEach(id => { const q = origPos.get(id); if (!q) return; a0 = Math.min(a0, q.x); a1 = Math.max(a1, q.x); b0 = Math.min(b0, q.y); b1 = Math.max(b1, q.y); });
    ids.forEach((id, i) => { const q = origPos.get(id) || {x: a0, y: b0}; px[i] = r.x + 10 + (q.x - a0) / Math.max(a1 - a0, 1) * (r.w - 20); py[i] = r.y + 10 + (q.y - b0) / Math.max(b1 - b0, 1) * (r.h - 20); });
    const es = []; RAW_EDGES.forEach(e => { const a = idx.get(e.from), b = idx.get(e.to); if (a !== undefined && b !== undefined && a !== b) es.push(a, b); });
    const cell = Math.max(Math.sqrt(r.w * r.h / n) * 0.9, 8);
    for (let it = 0; it < 70; it++) {
      const fx = new Float64Array(n), fy = new Float64Array(n), g = new Map();
      for (let i = 0; i < n; i++) { const k = Math.floor(px[i] / cell) * 100003 + Math.floor(py[i] / cell); (g.get(k) || g.set(k, []).get(k)).push(i); }
      for (let i = 0; i < n; i++) {
        const cx = Math.floor(px[i] / cell), cy = Math.floor(py[i] / cell);
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
          const c = g.get((cx + dx) * 100003 + cy + dy); if (!c) continue;
          for (const j of c) { if (j <= i) continue; const vx = px[i] - px[j], vy = py[i] - py[j], d2 = vx * vx + vy * vy + 0.01; if (d2 > cell * cell * 4) continue; const f = cell * cell / d2; fx[i] += vx * f; fy[i] += vy * f; fx[j] -= vx * f; fy[j] -= vy * f; }
        }
      }
      for (let k = 0; k < es.length; k += 2) { const a = es[k], b = es[k + 1], vx = px[b] - px[a], vy = py[b] - py[a], d = Math.sqrt(vx * vx + vy * vy) + 0.01, f = (d - cell * 1.2) * 0.08 / d; fx[a] += vx * f; fy[a] += vy * f; fx[b] -= vx * f; fy[b] -= vy * f; }
      const cool = 1 - it / 80;
      for (let i = 0; i < n; i++) { const l = Math.hypot(fx[i], fy[i]) || 1, m = Math.min(l, cell * 0.6 * cool + 0.5); px[i] = Math.min(r.x + r.w - 8, Math.max(r.x + 8, px[i] + fx[i] / l * m)); py[i] = Math.min(r.y + r.h - 8, Math.max(r.y + 8, py[i] + fy[i] / l * m)); }
    }
    ids.forEach((id, i) => out.set(id, {x: px[i], y: py[i]}));
  }
  function arrangeZones() {
    const cur = network.getPositions();
    if (!origPos) origPos = new Map(RAW_NODES.map(n => [n.id, {x: (cur[n.id] || {x: 0}).x, y: (cur[n.id] || {y: 0}).y}]));
    assignZones();
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; origPos.forEach(q => { x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); });
    const L = Math.max(x1 - x0, y1 - y0, 400) * 1.15, H = L * 0.8;
    zrects = new Map(ZONES.map(z => [z.id, {x: z.r[0] * L, y: z.r[1] * H, w: (z.r[2] - z.r[0]) * L, h: (z.r[3] - z.r[1]) * H}]));
    const groups = new Map(ZONES.map(z => [z.id, []])); RAW_NODES.forEach(n => groups.get(zassign.get(n.id) || 'be').push(n.id));
    const out = new Map(); groups.forEach((ids, zid) => relaxInto(zrects.get(zid), ids, out));
    nodesDS.update(RAW_NODES.map(n => ({id: n.id, x: out.get(n.id).x, y: out.get(n.id).y})));
    calcCents(); paintZones();
    try { network.fit({animation: {duration: 500, easingFunction: 'easeOutQuart'}}); } catch (e) {}
  }
  function restoreZones() {
    if (!origPos) return;
    nodesDS.update(RAW_NODES.map(n => ({id: n.id, x: origPos.get(n.id).x, y: origPos.get(n.id).y})));
    calcCents(); paintZones();
    try { network.fit({animation: {duration: 500, easingFunction: 'easeOutQuart'}}); } catch (e) {}
  }
  function commZone(cid) {
    if (zoneOverride.has(cid)) return zoneOverride.get(cid);
    const c = {}; RAW_NODES.forEach(n => { if (n.community === cid) { const z = zassign.get(n.id); if (z) c[z] = (c[z] || 0) + 1; } });
    return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || 'be';
  }
  function renderZoneList() {
    $('#gf-zonelist').innerHTML = ZONES.map(z => '<div class="gf-zrow"><span class="gf-zpos">' + z.pos + '</span><input class="gf-zname" data-z="' + z.id + '" value="' + E(z.name) + '" aria-label="Name of the ' + z.pos + ' zone" maxlength="24"><span class="gf-badge" data-zb="' + z.id + '">\u2013</span></div>').join('');
  }
  function paintZones() {
    const tg = $('#gf-zonetoggle'); tg.setAttribute('aria-pressed', zoned); tg.classList.toggle('on', zoned); $('.gf-badge', tg).textContent = zoned ? 'on' : 'off';
    const cnt = {}; zassign.forEach(z => { cnt[z] = (cnt[z] || 0) + 1; });
    $$('[data-zb]').forEach(b => { b.textContent = zoned ? (cnt[b.dataset.zb] || 0) : '\u2013'; });
    if (zoned) $$('.gf-tr').forEach(el => { const t = $('.gf-ztag', el); if (t) t.textContent = ZBYID.get(commZone(+el.dataset.cid)).name; });
  }
  renderZoneList();
  $('#gf-zonetoggle').addEventListener('click', () => {
    zoned = !zoned; document.body.classList.toggle('gf-zoned', zoned);
    if (zoned) arrangeZones(); else { restoreZones(); }
    paintZones();
  });
  $('#gf-zonelist').addEventListener('input', e => { const z = ZBYID.get(e.target.dataset.z); if (z) { z.name = e.target.value.trim() || z.pos; paintZones(); try { network.redraw(); } catch (x) {} } });
  $('#gf-tree').addEventListener('click', e => {
    const b = e.target.closest('[data-zc]'); if (!b) return; e.stopPropagation();
    const cid = +b.dataset.zc, cur = commZone(cid), nxt = ZONES[(ZONES.findIndex(z => z.id === cur) + 1) % ZONES.length].id;
    zoneOverride.set(cid, nxt); clearTimeout(zt2); zt2 = setTimeout(arrangeZones, 120); b.textContent = ZBYID.get(nxt).name;
  });
  network.on('beforeDrawing', ctx => {
    if (!zoned || !zrects) return;
    const s = network.getScale(); ctx.save();
    ZONES.forEach(z => { const r = zrects.get(z.id); ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, 40); else ctx.rect(r.x, r.y, r.w, r.h); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fill(); ctx.setLineDash([14 / s, 10 / s]); ctx.lineWidth = 1.5 / s; ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.stroke(); });
    ctx.restore();
  });
  network.on('afterDrawing', ctx => {
    if (!zoned || !zrects) return;
    const s = network.getScale(), cnt = {}; zassign.forEach(z => { cnt[z] = (cnt[z] || 0) + 1; });
    ctx.save(); ctx.font = '700 ' + 17 / s + 'px ' + getComputedStyle(document.body).fontFamily; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ZONES.forEach(z => { const r = zrects.get(z.id), txt = z.name + ' \u00b7 ' + (cnt[z.id] || 0), w = ctx.measureText(txt).width + 28 / s, h = 34 / s, x = r.x + 18 / s, y = r.y + 18 / s;
      ctx.fillStyle = '#1f2a2a'; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, h / 2); else ctx.rect(x, y, w, h); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.fillText(txt, x + 14 / s, y + h / 2); });
    ctx.restore();
  });

  paintRecents(); build();
})();
</script>
